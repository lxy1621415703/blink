name: Controller recovery experiments

on:
  push:
    paths:
      - .github/workflows/experiments.yml
      - requirements.txt
      - source/recovery_benchmark.py
      - source/run_upstream.py
      - source/test_recovery_benchmark.py
      - source/test_upstream_patch.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out experiment harness
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        id: setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install compatibility dependencies
        id: dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check experiment invariants
        id: tests
        run: python -m unittest discover -s source -p "test_*.py" -v

      - name: Evaluate original and repaired author heuristics
        id: upstream
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python source/run_upstream.py --output results/upstream

      - name: Run controller recovery mechanism experiment
        id: mechanism
        if: ${{ always() && steps.dependencies.outcome == 'success' && steps.tests.outcome == 'success' }}
        run: python source/recovery_benchmark.py --output results/mechanism --seeds 30 --exact-seeds 10 --milp-seconds 8

      - name: Save environment and print result summaries
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          UPSTREAM_OUTCOME: ${{ steps.upstream.outcome }}
          MECHANISM_OUTCOME: ${{ steps.mechanism.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys

          output = Path("results/environment")
          output.mkdir(parents=True, exist_ok=True)
          freeze = subprocess.run(
              [sys.executable, "-m", "pip", "freeze"],
              capture_output=True, text=True, check=False,
          )
          (output / "pip-freeze.txt").write_text(freeze.stdout, encoding="utf-8")
          (output / "pip-freeze.stderr.txt").write_text(freeze.stderr, encoding="utf-8")
          packages = {}
          for name in ("numpy", "scipy", "gurobipy"):
              try:
                  packages[name] = importlib.metadata.version(name)
              except importlib.metadata.PackageNotFoundError:
                  packages[name] = None
          record = {
              "python": platform.python_version(),
              "platform": platform.platform(),
              "packages": packages,
              "dependency_environment": "Python 3.10 compatibility pins; not the authors' original environment",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "harness_commit": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "python_hash_seed": os.environ.get("PYTHONHASHSEED"),
              "outcomes": {
                  key: os.environ.get(key.upper() + "_OUTCOME")
                  for key in ("dependencies", "tests", "upstream", "mechanism")
              },
          }
          (output / "provenance.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8",
          )
          print("CLOUD_PIPELINE_JSON=" + json.dumps(record, sort_keys=True))
          for filename in ("results/upstream/summary.json", "results/mechanism/summary.json"):
              path = Path(filename)
              if path.is_file():
                  value = json.loads(path.read_text(encoding="utf-8"))
                  if filename == "results/mechanism/summary.json":
                      keys = (
                          "version", "execution", "configuration", "aggregates",
                          "paired_loss_comparisons", "exact_loss_gaps", "total_violations",
                          "all_negative_controls_zero",
                      )
                      value = {key: value.get(key) for key in keys}
                  print("SUMMARY_BEGIN=" + filename)
                  print(json.dumps(value, sort_keys=True))
                  print("SUMMARY_END=" + filename)
              else:
                  print("SUMMARY_MISSING=" + filename)
          PY

      - name: Preserve results and failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controller-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 7

