name: Executable closure recovery experiment

on:
  push:
    paths:
      - .github/workflows/closure.yml
      - closure_protocol.json
      - source/executable_closure.py
      - source/validate_closure.py
      - source/benchmark_closure.py
      - source/test_executable_closure.py
      - source/test_validate_closure.py
      - source/test_benchmark_closure.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install compatibility dependencies
        id: dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check closure semantics, validator and evidence metrics
        id: tests
        run: python -m unittest discover -s source -p "test_*closure.py" -v

      - name: Run frozen development, holdout and scale protocol
        id: experiment
        if: ${{ steps.tests.outcome == 'success' }}
        run: python source/benchmark_closure.py --output results/closure --protocol closure_protocol.json --suite all

      - name: Preserve execution environment
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p results/closure/environment
          python -m pip freeze > results/closure/environment/pip-freeze.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import sys
          record = {
              "python": sys.version,
              "platform": platform.platform(),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "harness_commit": os.environ.get("GITHUB_SHA"),
              "threads": {name: os.environ.get(name) for name in
                          ("OMP_NUM_THREADS", "OPENBLAS_NUM_THREADS", "MKL_NUM_THREADS")},
          }
          path = Path("results/closure/environment/provenance.json")
          path.write_text(json.dumps(record, sort_keys=True) + "\n", encoding="utf-8")
          print("CLOSURE_ENVIRONMENT_JSON=" + json.dumps(record, sort_keys=True))
          PY

      - name: Preserve raw scenarios, plans, schedules, timings and audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: executable-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/closure/
          if-no-files-found: warn
          retention-days: 7
