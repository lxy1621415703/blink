name: Fast recovery scheduling

on:
  push:
    paths:
      - .github/workflows/fast.yml
      - speed_protocol.json
      - source/fast_engine.py
      - source/fast_policies.py
      - source/benchmark_fast.py
      - source/test_fast_engine.py
      - source/test_fast_policies.py
      - source/test_benchmark_fast.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speed-quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify semantics and feasibility
        run: python -m unittest discover -s source -p 'test_*.py' -v
      - name: Evaluate fixed development, holdout and scale suites
        run: python source/benchmark_fast.py --output results/speed --suite all
      - name: Preserve environment and full summary
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          out = Path('results/speed')
          out.mkdir(parents=True, exist_ok=True)
          files = ['speed_protocol.json', 'source/recovery_benchmark.py',
                   'source/fast_engine.py', 'source/fast_policies.py', 'source/benchmark_fast.py']
          record = {'run_id': os.environ.get('GITHUB_RUN_ID'),
                    'harness_commit': os.environ.get('GITHUB_SHA'),
                    'python': sys.version, 'platform': platform.platform(),
                    'source_sha256': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
                                      for p in files if Path(p).is_file()}}
          (out/'provenance.json').write_text(json.dumps(record, indent=2), encoding='utf-8')
          frozen = subprocess.run([sys.executable, '-m', 'pip', 'freeze'], capture_output=True, text=True)
          (out/'pip-freeze.txt').write_text(frozen.stdout, encoding='utf-8')
          print('FAST_ENVIRONMENT_JSON='+json.dumps(record, sort_keys=True))
          summary = out/'summary.json'
          if summary.is_file():
              print('FAST_FULL_SUMMARY_JSON='+json.dumps(json.loads(summary.read_text(encoding='utf-8')), sort_keys=True))
          else:
              print('FAST_SUMMARY_MISSING')
          PY
      - name: Upload raw measurements and schedules
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/speed/
          retention-days: 7
          if-no-files-found: warn

